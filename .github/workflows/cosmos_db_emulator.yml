name: .NET test with Cosmos DB Emulator
on:
    workflow_dispatch:
jobs:
  unit_tests:
    name: Run .NET unit tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Start Azure Cosmos DB emulator
        run: |
          Write-Host "Launching Cosmos DB Emulator"
          Import-Module "$env:ProgramFiles\Azure Cosmos DB Emulator\PSModules\Microsoft.Azure.CosmosDB.Emulator"
          Start-CosmosDbEmulator
      - name: Run .NET tests
        timeout-minutes: 10
        run: dotnet test -graphBuild:True .\Extensions\Cosmos\Cosmos.DataTransfer.CosmosExtension.UnitTests\ --logger "trx;LogFileName=cosmos.trx" --results-directory TestResults
        env:
          Cosmos_Endpoint: https://localhost:8081/
          Cosmos_Key: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      - name: Require both integration tests to pass
        if: always()
        shell: pwsh
        run: ./.github/scripts/Assert-CosmosIntegrationResults.ps1 -Path TestResults/cosmos.trx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cosmos-windows
          path: TestResults/
          if-no-files-found: error
