name: Linux .NET test with Cosmos DB Emulator
on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Extensions/Cosmos/**'
      - 'Extensions/Json/**'
      - 'Interfaces/**'
      - 'Directory.*.props'
      - '.github/scripts/*Cosmos*.ps1'
      - '.github/workflows/linux-cosmos-emulator-test.yml'

permissions:
  contents: read

jobs:
  integration_guard:
    name: Verify Cosmos integration test failure guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build Cosmos tests
        run: dotnet build Extensions/Cosmos/Cosmos.DataTransfer.CosmosExtension.UnitTests/
      - name: Verify missing configuration and failed initialization
        shell: pwsh
        run: ./.github/scripts/Test-CosmosIntegrationGuard.ps1
      - name: Upload guard test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmos-integration-guard
          path: TestResults/guard/
          if-no-files-found: error

  cosmos_tests_linux:
    name: Run Cosmos .NET unit tests on Linux (${{ matrix.emulator.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        emulator:
          - name: current
            image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
            allow_failure: false
          - name: vnext
            image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
            allow_failure: true
    # Preview compatibility is advisory; the current emulator and guard job are mandatory.
    continue-on-error: ${{ matrix.emulator.allow_failure }}
    services:
      cosmos-emulator:
        image: ${{ matrix.emulator.image }}
        ports:
          - 8081:8081
          - 8080:8080
        env:
          PROTOCOL: https
          AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 10
          AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: false
          AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Wait for Cosmos Emulator and trust its certificate
        env:
          EMULATOR_VERSION: ${{ matrix.emulator.name }}
          EMULATOR_ID: ${{ job.services.cosmos-emulator.id }}
        run: |
          mkdir -p TestResults
          deadline=$((SECONDS + 600))
          ready=false
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(docker inspect --format '{{.State.Running}}' "$EMULATOR_ID")" != "true" ]; then
              echo "::error::Cosmos DB emulator stopped during startup."
              exit 1
            fi
            if [ "$EMULATOR_VERSION" = "vnext" ]; then
              if curl --fail --silent --show-error --max-time 10 http://localhost:8080/ready; then
                ready=true
                break
              fi
            elif curl --fail --silent --show-error --insecure --max-time 10 \
                https://localhost:8081/_explorer/emulator.pem -o "$RUNNER_TEMP/emulator.crt"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Cosmos DB emulator did not become ready within 10 minutes."
            exit 1
          fi
          if [ "$EMULATOR_VERSION" = "vnext" ]; then
            timeout 30 openssl s_client -connect localhost:8081 -servername localhost -showcerts \
              </dev/null > "$RUNNER_TEMP/emulator-tls.txt"
            sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' \
              "$RUNNER_TEMP/emulator-tls.txt" > "$RUNNER_TEMP/emulator.crt"
          fi
          openssl x509 -in "$RUNNER_TEMP/emulator.crt" -noout -subject -issuer -dates
          sudo cp "$RUNNER_TEMP/emulator.crt" /usr/local/share/ca-certificates/cosmos-emulator.crt
          sudo update-ca-certificates
          # An unauthenticated response is fine here; TLS validation must succeed.
          curl --silent --show-error --max-time 15 https://localhost:8081/ -o /dev/null

      - name: Run Cosmos Extension Tests
        timeout-minutes: 10
        run: >-
          dotnet test Extensions/Cosmos/Cosmos.DataTransfer.CosmosExtension.UnitTests/
          --logger "trx;LogFileName=cosmos.trx" --results-directory TestResults
        env:
          Cosmos_Endpoint: https://localhost:8081/
          Cosmos_Key: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==

      - name: Require both integration tests to pass
        if: always()
        shell: pwsh
        run: ./.github/scripts/Assert-CosmosIntegrationResults.ps1 -Path TestResults/cosmos.trx

      - name: Capture emulator diagnostics
        if: always()
        env:
          EMULATOR_ID: ${{ job.services.cosmos-emulator.id }}
          EMULATOR_VERSION: ${{ matrix.emulator.name }}
        run: |
          mkdir -p TestResults
          docker logs "$EMULATOR_ID" > TestResults/emulator.log 2>&1
          docker inspect "$EMULATOR_ID" > TestResults/emulator-inspect.json
          if [ "$EMULATOR_VERSION" = "vnext" ]; then
            curl --silent --show-error --max-time 10 http://localhost:8080/status \
              -o TestResults/emulator-status.json || echo "::warning::Could not collect vNext status."
          fi

      - name: Upload emulator and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cosmos-linux-${{ matrix.emulator.name }}
          path: TestResults/
          if-no-files-found: error
