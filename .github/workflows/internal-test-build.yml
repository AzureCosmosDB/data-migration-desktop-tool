name: Build desktop binaries
on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: Build self-contained executables
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0.403-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            platform-short: win
            runtime: win-x64
          - platform: windows
            platform-short: win
            runtime: win-arm64
          - platform: mac
            platform-short: mac
            runtime: osx-x64
          - platform: mac
            platform-short: mac
            runtime: osx-arm64
          - platform: linux
            platform-short: linux
            runtime: linux-x64
          - platform: linux
            platform-short: linux
            runtime: linux-arm64
    steps:
      - name: Check .NET version
        run: dotnet --version
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Execute Action build-with-plugins
        uses: ./.github/actions/build-with-plugins
        with:
          platform: ${{ matrix.platform }}
          platform-short: ${{ matrix.platform-short }}
          runtime: ${{ matrix.runtime }}
          build-version: 0.0.${{ github.run_number }}
        env:
          PLATFORM: ${{ matrix.platform }}
          RUNTIME: ${{ matrix.runtime }}

  smoke-package:
    name: Native smoke (${{ matrix.runtime }})
    needs: build-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-11-arm
            runtime: win-arm64
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.runtime }}-package
          path: package
      - name: Restore executable permission
        if: runner.os != 'Windows'
        run: chmod +x package/dmt
      - name: Verify JSON round-trip failure guards
        shell: pwsh
        run: ./.github/scripts/Test-JsonRoundTripGuard.ps1
      - name: Verify runtime, MEF discovery and JSON migration
        shell: pwsh
        run: ./.github/scripts/Test-PublishedApp.ps1 -PackagePath package
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Exercise serviced dependencies on the native runtime
        shell: pwsh
        run: |
          foreach ($extension in @('Mongo', 'Parquet', 'SqlServer')) {
            dotnet test "Extensions/$extension/Cosmos.DataTransfer.${extension}Extension.UnitTests" `
              --configuration Release --filter 'FullyQualifiedName~CompatibilityTests' `
              --logger trx --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { throw "$extension dependency compatibility tests failed." }
          }
      - name: Upload native dependency results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependencies-${{ matrix.runtime }}
          path: TestResults/
          if-no-files-found: error

  smoke-container:
    name: Build and smoke container (no publication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build local image
        run: docker build --build-arg BUILD_VERSION=0.0.${{ github.run_number }} --tag dmt-smoke .
      - name: Verify container application version selection
        shell: pwsh
        run: ./.github/scripts/Test-ContainerBuildVersion.ps1
      - name: Verify runtime and extension discovery
        run: |
          docker run --rm --entrypoint cat dmt-smoke /app/runtime-info.json > runtime-info.json
          expected=$(sed -n 's/.*<RuntimeFrameworkVersion>\(.*\)<\/RuntimeFrameworkVersion>.*/\1/p' Directory.Build.props)
          jq -e --arg version "$expected" '.runtimeOptions.tfm == "net10.0" and any(.runtimeOptions.includedFrameworks[]; .name == "Microsoft.NETCore.App" and .version == $version)' runtime-info.json
          docker run --rm dmt-smoke list > extensions.txt
          cat extensions.txt
          grep -F '15 Source Extensions' extensions.txt
          grep -F '15 Sink Extensions' extensions.txt
      - name: Migrate synthetic JSON through mounted files
        run: |
          mkdir -p "$RUNNER_TEMP/dmt-smoke/config" "$RUNNER_TEMP/dmt-smoke/data"
          printf '%s' '[{"id":"one","value":42},{"id":"two","value":-1}]' > "$RUNNER_TEMP/dmt-smoke/data/input.json"
          printf '%s' '{"Source":"JSON","Sink":"JSON","SourceSettings":{"FilePath":"/data/input.json"},"SinkSettings":{"FilePath":"/data/output.json"}}' > "$RUNNER_TEMP/dmt-smoke/config/settings.json"
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/dmt-smoke/config:/config:ro" -v "$RUNNER_TEMP/dmt-smoke/data:/data" dmt-smoke run --settings /config/settings.json
          jq -e '. == [{"id":"one","value":42},{"id":"two","value":-1}]' "$RUNNER_TEMP/dmt-smoke/data/output.json"
      - name: Migrate synthetic Parquet inside the container
        run: |
          printf '%s' '{"Source":"JSON","Sink":"Parquet","SourceSettings":{"FilePath":"/data/input.json"},"SinkSettings":{"FilePath":"/data/output.parquet"}}' > "$RUNNER_TEMP/dmt-smoke/config/settings.json"
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/dmt-smoke/config:/config:ro" -v "$RUNNER_TEMP/dmt-smoke/data:/data" dmt-smoke run --settings /config/settings.json
          printf '%s' '{"Source":"Parquet","Sink":"JSON","SourceSettings":{"FilePath":"/data/output.parquet"},"SinkSettings":{"FilePath":"/data/parquet-output.json"}}' > "$RUNNER_TEMP/dmt-smoke/config/settings.json"
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/dmt-smoke/config:/config:ro" -v "$RUNNER_TEMP/dmt-smoke/data:/data" dmt-smoke run --settings /config/settings.json
          jq -e '. == [{"id":"one","value":42},{"id":"two","value":-1}]' "$RUNNER_TEMP/dmt-smoke/data/parquet-output.json"
      - name: Inspect actual container dependency binaries
        shell: pwsh
        run: |
          $container = docker create dmt-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Could not create inspection container.' }
          try {
            docker cp "${container}:/app" container-package
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract container binaries.' }
            ./.github/scripts/Assert-PackageDependencies.ps1 -PackagePath container-package
            $deps = Get-Content container-package/dependency-info.json -Raw | ConvertFrom-Json -AsHashtable
            if (-not $deps.libraries.ContainsKey('dmt/0.0.${{ github.run_number }}')) {
              throw 'Container application version does not match BUILD_VERSION.'
            }
          } finally {
            docker rm $container
          }